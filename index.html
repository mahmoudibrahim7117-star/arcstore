<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC STORE | متجر الألعاب والخدمات الرقمية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #0b0b0f;
      --bg-card: #13131c;
      --bg-header: #0d0d12;
      --accent-red: #e50914;
      --accent-red-hover: #ff1e2a;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --border-color: #222232;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; }

    /* Header */
    header {
      background: var(--bg-header); border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; z-index: 1000; padding: 15px 5%;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo-area { display: flex; align-items: center; gap: 10px; font-size: 1.6rem; font-weight: 900; color: #fff; letter-spacing: 1px; }
    .logo-area span { color: var(--accent-red); }

    .header-controls { display: flex; align-items: center; gap: 15px; }
    .currency-select {
      background: #1a1a24; border: 1px solid var(--border-color); color: #fff;
      padding: 8px 12px; border-radius: 8px; font-weight: 700; outline: none; cursor: pointer;
    }

    /* Hero Section */
    .hero { text-align: center; padding: 40px 20px 20px; }
    .hero h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; color: #fff; }
    .hero p { color: var(--text-muted); font-size: 1.1rem; }

    /* Categories Navigation Bar */
    .categories-nav {
      display: flex; justify-content: center; gap: 10px; padding: 0 20px; margin-bottom: 35px; flex-wrap: wrap;
    }
    .cat-btn {
      background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
      padding: 10px 22px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
      transition: all 0.25s ease; display: flex; align-items: center; gap: 8px;
    }
    .cat-btn:hover, .cat-btn.active {
      background: var(--accent-red); border-color: var(--accent-red); color: #fff; transform: translateY(-2px);
    }

    /* Products Grid */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }

    .product-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .product-card:hover { transform: translateY(-5px); border-color: var(--accent-red); }

    .product-img-container { position: relative; width: 100%; height: 180px; background: #000; overflow: hidden; }
    .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .product-card:hover .product-img { transform: scale(1.05); }

    .product-tag {
      position: absolute; top: 10px; right: 10px; background: rgba(11, 11, 15, 0.85);
      border: 1px solid var(--border-color); color: var(--accent-red); font-size: 0.75rem;
      padding: 4px 10px; border-radius: 6px; font-weight: 800; backdrop-filter: blur(5px);
    }

    .product-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .product-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 8px; color: #fff; line-height: 1.4; }
    .product-desc { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .product-price { font-size: 1.3rem; font-weight: 900; color: #fff; }

    .buy-btn {
      background: var(--accent-red); color: #fff; border: none; padding: 8px 16px;
      border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: background 0.2s;
    }
    .buy-btn:hover { background: var(--accent-red-hover); }

    .empty-state { grid-column: 1/-1; text-align: center; padding: 50px; color: var(--text-muted); background: var(--bg-card); border-radius: 16px; border: 1px dashed var(--border-color); }

    /* Modal Checkout */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
      z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border-color); width: 100%; max-width: 480px;
      border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.9rem; }
    .form-control {
      width: 100%; background: #0b0b0f; border: 1px solid var(--border-color); color: #fff;
      padding: 12px; border-radius: 10px; outline: none; font-size: 0.95rem;
    }
    .form-control:focus { border-color: var(--accent-red); }

    .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .pay-btn {
      background: #0b0b0f; border: 1px solid var(--border-color); color: #fff; padding: 10px;
      border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .pay-btn.selected { border-color: var(--accent-red); background: rgba(229, 9, 20, 0.15); }
  </style>
</head>
<body>

  <header>
    <div class="logo-area"><i class="fa-solid fa-gamepad" style="color:var(--accent-red)"></i> ARC <span>STORE</span></div>
    <div class="header-controls">
      <select id="currencySelect" class="currency-select" onchange="changeCurrency(this.value)">
        <option value="USD">USD ($)</option>
        <option value="AED">AED (درهم)</option>
        <option value="SAR">SAR (ريال)</option>
      </select>
    </div>
  </header>

  <section class="hero">
    <h1>وجهتك المثالية للألعاب والخدمات الرقمية</h1>
    <p>أسرع تسليم، أفضل الأسعار، ودعم فني متواصل</p>
  </section>

  <!-- الأقسام المتغيرة ديناميكياً -->
  <div class="categories-nav" id="categoriesContainer"></div>

  <main class="container">
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- نافذة الطلب -->
  <div class="modal" id="checkoutModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h3 id="modalTitle" style="font-size: 1.2rem; font-weight: 800;">تأكيد الطلب</h3>
        <i class="fa-solid fa-xmark" style="cursor:pointer; font-size: 1.3rem; color: var(--text-muted);" onclick="closeCheckout()"></i>
      </div>

      <form onsubmit="executeOrder(event)">
        <div class="form-group">
          <label id="qtyLabel">الكمية المطلوبة</label>
          <input type="number" id="orderQty" class="form-control" oninput="recalcPrice()">
          <small id="qtyNotice" style="color: var(--accent-red); font-size: 0.75rem; display: none; margin-top: 4px;">* الحد الأدنى لطلبات هذا القسم هو 250</small>
        </div>

        <div class="form-group">
          <label>رابط الحساب / معرف المستخدم / الإيميل</label>
          <input type="text" id="targetUrl" class="form-control" placeholder="أدخل معلومات التفعيل هنا..." required>
        </div>

        <div class="form-group">
          <label>طريقة الدفع</label>
          <div class="pay-options">
            <div class="pay-btn selected" id="optCard" onclick="selectPay('card')"><i class="fa-solid fa-credit-card"></i> بطاقة ائتمان</div>
            <div class="pay-btn" id="optApple" onclick="selectPay('apple')"><i class="fa-brands fa-apple"></i> Apple Pay</div>
          </div>
        </div>

        <div style="background: #0b0b0f; border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.9rem; color: var(--text-muted);">المبلغ الإجمالي:</span>
          <span id="totalCost" style="font-size: 1.4rem; font-weight: 900; color: var(--accent-red);">0.00</span>
        </div>

        <button type="submit" class="buy-btn" style="width: 100%; padding: 12px; font-size: 1rem; background: #25d366;">
          <i class="fa-brands fa-whatsapp"></i> إتمام الطلب عبر الواتساب
        </button>
      </form>
    </div>
  </div>

  <script>
    const rates = { USD: 1, AED: 3.67, SAR: 3.75 };
    const symbols = { USD: '$', AED: 'AED', SAR: 'SAR' };
    let selectedCurrency = 'USD';

    let categories = JSON.parse(localStorage.getItem('arc_categories')) || [];
    let products = JSON.parse(localStorage.getItem('arc_products')) || [];
    let orders = JSON.parse(localStorage.getItem('arc_orders')) || [];
    let settings = JSON.parse(localStorage.getItem('arc_settings')) || { whatsapp: '971500000000' };

    let currentProd = null;
    let currentCat = null;
    let payMethod = 'card';
    let currentFilter = 'all';

    function changeCurrency(curr) {
      selectedCurrency = curr;
      renderProducts(currentFilter);
    }

    function renderFilters() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = `<button class="cat-btn active" onclick="filterCat('all', this)"><i class="fa-solid fa-store"></i> الكل</button>`;
      
      categories.forEach(cat => {
        container.innerHTML += `<button class="cat-btn" onclick="filterCat('${cat.id}', this)"><i class="fa-solid ${cat.icon || 'fa-tag'}"></i> ${cat.name}</button>`;
      });
    }

    function renderProducts(filter = 'all') {
      currentFilter = filter;
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      categories = JSON.parse(localStorage.getItem('arc_categories')) || [];
      products = JSON.parse(localStorage.getItem('arc_products')) || [];

      const list = filter === 'all' ? products : products.filter(p => p.category === filter);

      if(list.length === 0) {
        grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-gamepad" style="font-size: 2rem; margin-bottom: 10px; color: var(--accent-red);"></i><br>لا توجد منتجات متوفرة حالياً في هذا القسم.</div>`;
        return;
      }

      list.forEach(p => {
        const cat = categories.find(c => c.id === p.category);
        const isBoost = cat ? (cat.type === 'boost') : false;
        const basePrice = parseFloat(p.priceUSD || p.price || 0);
        const converted = (basePrice * rates[selectedCurrency]).toFixed(2);
        const priceText = isBoost ? `${converted} ${symbols[selectedCurrency]} / 1000` : `${converted} ${symbols[selectedCurrency]}`;

        grid.innerHTML += `
          <div class="product-card">
            <div class="product-img-container">
              <img src="${p.image || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&q=80'}" class="product-img" alt="${p.title}">
              <span class="product-tag">${cat ? cat.name : 'منتج'}</span>
            </div>
            <div class="product-body">
              <div>
                <h3 class="product-title">${p.title}</h3>
                <p class="product-desc">${p.desc || 'منتج رقمي مضمون وتسليم سريع.'}</p>
              </div>
              <div class="product-footer">
                <div class="product-price">${priceText}</div>
                <button class="buy-btn" onclick="openCheckout('${p.id}')">شراء</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function filterCat(id, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(id);
    }

    function openCheckout(id) {
      currentProd = products.find(p => p.id === id);
      if(!currentProd) return;

      currentCat = categories.find(c => c.id === currentProd.category);
      const isBoost = currentCat ? (currentCat.type === 'boost') : false;

      document.getElementById('modalTitle').innerText = currentProd.title;
      const qtyInput = document.getElementById('orderQty');
      const qtyNotice = document.getElementById('qtyNotice');

      if(isBoost) {
        qtyInput.value = 250; qtyInput.min = 250; qtyInput.step = 50;
        qtyNotice.style.display = 'block';
      } else {
        qtyInput.value = 1; qtyInput.min = 1; qtyInput.step = 1;
        qtyNotice.style.display = 'none';
      }

      recalcPrice();
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeCheckout() { document.getElementById('checkoutModal').style.display = 'none'; }

    function recalcPrice() {
      if(!currentProd) return;
      const qty = parseFloat(document.getElementById('orderQty').value) || 0;
      const isBoost = currentCat ? (currentCat.type === 'boost') : false;
      const basePrice = parseFloat(currentProd.priceUSD || currentProd.price || 0);
      let totalUSD = isBoost ? (qty / 1000) * basePrice : qty * basePrice;
      const finalPrice = (totalUSD * rates[selectedCurrency]).toFixed(2);
      document.getElementById('totalCost').innerText = `${finalPrice} ${symbols[selectedCurrency]}`;
    }

    function selectPay(type) {
      payMethod = type;
      document.getElementById('optCard').classList.toggle('selected', type === 'card');
      document.getElementById('optApple').classList.toggle('selected', type === 'apple');
    }

    function executeOrder(e) {
      e.preventDefault();
      const qty = parseFloat(document.getElementById('orderQty').value);
      const isBoost = currentCat ? (currentCat.type === 'boost') : false;

      if(isBoost && qty < 250) { alert('الحد الأدنى للكمية هو 250'); return; }

      const target = document.getElementById('targetUrl').value;
      const basePrice = parseFloat(currentProd.priceUSD || currentProd.price || 0);
      let totalUSD = isBoost ? (qty / 1000) * basePrice : qty * basePrice;
      const totalFormatted = (totalUSD * rates[selectedCurrency]).toFixed(2) + ' ' + symbols[selectedCurrency];

      const order = {
        id: 'ORD-' + Date.now(),
        productTitle: currentProd.title,
        quantity: qty,
        totalPrice: totalFormatted,
        targetUrl: target,
        payMethod: payMethod === 'card' ? 'بطاقة ائتمانية' : 'Apple Pay',
        date: new Date().toLocaleString('ar-EG')
      };

      orders.unshift(order);
      localStorage.setItem('arc_orders', JSON.stringify(orders));

      const msg = `*طلب جديد من ARC STORE* 🎮\n\n• المنتج: ${currentProd.title}\n• الكمية: ${qty}\n• المبلغ: ${totalFormatted}\n• طريقة الدفع: ${order.payMethod}\n• الحساب/الرابط: ${target}`;
      closeCheckout();
      window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    setInterval(() => {
      if(localStorage.getItem('arc_categories') !== JSON.stringify(categories)) {
        renderFilters(); renderProducts(currentFilter);
      }
    }, 1000);

    renderFilters();
    renderProducts();
  </script>
</body>
</html>
