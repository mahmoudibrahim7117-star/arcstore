<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC STORE | متجر الخدمات الرقمية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { tajawal: ['Tajawal', 'sans-serif'] },
                    colors: {
                        arcRed: '#FF0033',
                        arcDark: '#050507',
                        arcCard: '#0D0D12'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #050507;
            color: #FFFFFF;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 51, 0.15), transparent 40%),
                linear-gradient(to right, rgba(255, 0, 51, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 51, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }
        .neon-border {
            border: 1px solid #FF0033;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.4);
        }
        .neon-border-subtle {
            border: 1px solid rgba(255, 0, 51, 0.3);
        }
        .neon-border-subtle:hover {
            border-color: #FF0033;
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.5);
        }
        .neon-text {
            text-shadow: 0 0 15px rgba(255, 0, 51, 0.9);
        }
        .neon-btn {
            background: linear-gradient(135deg, #FF0033 0%, #B30024 100%);
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
        }
        .neon-btn:hover {
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.8);
        }
        @keyframes modalEntrance {
            0% { opacity: 0; transform: scale(0.85) translateY(-20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal {
            animation: modalEntrance 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050507; }
        ::-webkit-scrollbar-thumb { background: #FF0033; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- Modal التقييمات التلقائي -->
    <div id="reviewsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md hidden">
        <div class="bg-arcCard neon-border rounded-2xl max-w-lg w-full p-6 relative animate-modal">
            <button onclick="closeReviewsModal()" class="absolute top-4 left-4 text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-arcRed/20 text-arcRed rounded-full flex items-center justify-center mx-auto mb-3 border border-arcRed text-2xl shadow-[0_0_20px_#FF0033]">
                    <i class="fa-solid fa-star"></i>
                </div>
                <h3 class="text-2xl font-black text-white">آراء وتقييمات العملاء <span class="text-arcRed">★</span></h3>
                <p class="text-xs text-gray-400 mt-1">رضا عملائنا هو هدفنا الأول دائماً في ARC STORE</p>
            </div>
            <div id="reviewsList" class="space-y-4 max-h-80 overflow-y-auto pr-2">
                <!-- تقييمات -->
            </div>
            <button onclick="closeReviewsModal()" class="mt-6 w-full py-3 neon-btn text-white font-bold rounded-xl shadow-lg transition">
                تصفح الخدمات الآن
            </button>
        </div>
    </div>

    <!-- الهيدر Navigation -->
    <header class="sticky top-0 z-40 bg-black/90 backdrop-blur-md border-b border-arcRed/30 shadow-[0_4px_20px_rgba(255,0,51,0.2)]">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-black border-2 border-arcRed rounded-xl flex items-center justify-center font-black text-2xl text-white tracking-widest shadow-[0_0_20px_#FF0033]">
                    ARC
                </div>
                <div>
                    <h1 class="text-xl font-black text-white tracking-wider flex items-center gap-1">
                        ARC <span class="text-arcRed neon-text">STORE</span>
                    </h1>
                    <p class="text-[10px] text-gray-400">متجر الخدمات الرقمية الشامل</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- محول العملات (الدرهم الإماراتي AED هو الأساسي) -->
                <select id="currencySelector" onchange="changeCurrency(this.value)" class="bg-black text-xs text-white border border-arcRed/40 rounded-lg px-2.5 py-2 outline-none focus:border-arcRed">
                    <option value="AED" selected>AED (د.إ) - الرئيسية</option>
                    <option value="SAR">SAR (ر.س)</option>
                    <option value="USD">USD ($)</option>
                </select>

                <!-- زر آراء العملاء -->
                <button onclick="openReviewsModal()" class="p-2 text-gray-300 hover:text-arcRed transition" title="تقييمات العملاء">
                    <i class="fa-solid fa-star text-lg"></i>
                </button>

                <!-- زر السلة -->
                <button onclick="toggleCartDrawer()" class="relative p-2.5 bg-black border border-arcRed/40 rounded-xl hover:border-arcRed transition">
                    <i class="fa-solid fa-cart-shopping text-arcRed"></i>
                    <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-arcRed text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-[0_0_10px_#FF0033]">0</span>
                </button>

                <!-- رابط لوحة الأدمن المستقلة -->
                <a href="admin.html" target="_blank" class="p-2.5 bg-black border border-arcRed/40 rounded-xl hover:bg-arcRed/20 text-gray-300 hover:text-white transition" title="لوحة تحكم الأدمن">
                    <i class="fa-solid fa-user-shield text-arcRed"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow">
        
        <!-- قسم الإحصائيات -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
            <div class="bg-arcCard neon-border-subtle p-4 rounded-2xl text-center">
                <div class="text-2xl font-black text-arcRed neon-text mb-1" id="statOrders">0</div>
                <div class="text-xs text-gray-400">طلبات مكتملة</div>
            </div>
            <div class="bg-arcCard neon-border-subtle p-4 rounded-2xl text-center">
                <div class="text-2xl font-black text-white mb-1" id="statClients">0</div>
                <div class="text-xs text-gray-400">عميل سعيد</div>
            </div>
            <div class="bg-arcCard neon-border-subtle p-4 rounded-2xl text-center">
                <div class="text-2xl font-black text-arcRed neon-text mb-1">4.9/5</div>
                <div class="text-xs text-gray-400">تقييم المتجر</div>
            </div>
            <div class="bg-arcCard neon-border-subtle p-4 rounded-2xl text-center">
                <div class="text-2xl font-black text-white mb-1">100%</div>
                <div class="text-xs text-gray-400">ضمان وتسليم سريع</div>
            </div>
        </section>

        <!-- فلتر الأقسام -->
        <section class="mb-8">
            <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="categoryFilters">
                <!-- ينشأ ديناميكياً -->
            </div>
        </section>

        <!-- شبكة المنتجات -->
        <section>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="productsGrid">
                <!-- ينشأ ديناميكياً -->
            </div>
        </section>
    </main>

    <!-- Drawer سلة التسوق -->
    <div id="cartDrawer" class="fixed inset-0 z-50 flex justify-end bg-black/80 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="bg-arcCard w-full max-w-md h-full p-6 flex flex-col justify-between border-r border-arcRed/50 shadow-[0_0_30px_rgba(255,0,51,0.3)] overflow-y-auto">
            <div>
                <div class="flex justify-between items-center border-b border-white/10 pb-4 mb-4">
                    <h3 class="text-lg font-bold flex items-center gap-2 text-white">
                        <i class="fa-solid fa-cart-shopping text-arcRed"></i>
                        عربة التسوق
                    </h3>
                    <button onclick="toggleCartDrawer()" class="text-gray-400 hover:text-white">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <div id="cartItems" class="space-y-4 mb-6">
                    <!-- عناصر السلة -->
                </div>
            </div>

            <div class="border-t border-white/10 pt-4 space-y-4">
                <!-- كود الخصم -->
                <div class="flex gap-2">
                    <input type="text" id="couponCode" placeholder="كود الخصم (جرب ARC2026)" class="bg-black border border-white/10 rounded-xl px-3 py-2 text-xs w-full text-white focus:border-arcRed outline-none">
                    <button onclick="applyCoupon()" class="bg-white/10 hover:bg-arcRed text-white text-xs px-4 py-2 rounded-xl transition font-bold">تطبيق</button>
                </div>
                <div id="couponMessage" class="text-xs font-bold hidden"></div>

                <!-- الفاتورة -->
                <div class="bg-black/60 p-4 rounded-xl space-y-2 text-xs border border-white/5">
                    <div class="flex justify-between text-gray-400">
                        <span>المجموع:</span>
                        <span id="subtotalPrice">0</span>
                    </div>
                    <div class="flex justify-between text-emerald-400 hidden" id="discountRow">
                        <span>الخصم:</span>
                        <span id="discountPrice">0</span>
                    </div>
                    <div class="flex justify-between text-base font-black text-white pt-2 border-t border-white/10">
                        <span>الإجمالي النهائي:</span>
                        <span id="totalPrice" class="text-arcRed neon-text">0</span>
                    </div>
                </div>

                <!-- بيانات الشراء -->
                <div class="space-y-2">
                    <input type="text" id="custName" placeholder="الاسم الكامل *" class="bg-black border border-white/10 rounded-xl px-3 py-2 text-xs w-full text-white outline-none focus:border-arcRed">
                    <input type="email" id="custEmail" placeholder="البريد الإلكتروني *" class="bg-black border border-white/10 rounded-xl px-3 py-2 text-xs w-full text-white outline-none focus:border-arcRed">
                    <input type="tel" id="custPhone" placeholder="رقم الواتساب مع المفتاح *" class="bg-black border border-white/10 rounded-xl px-3 py-2 text-xs w-full text-white outline-none focus:border-arcRed">
                    <input type="text" id="custAccount" placeholder="رابط الحساب / اليوزر المستهدف *" class="bg-black border border-white/10 rounded-xl px-3 py-2 text-xs w-full text-white outline-none focus:border-arcRed">
                </div>

                <button onclick="checkoutToWhatsApp()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-white flex items-center justify-center gap-2 shadow-lg transition">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    إرسال الطلب عبر الواتساب
                </button>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="bg-black border-t border-white/10 py-6 text-center text-xs text-gray-500">
        <p>جميع الحقوق محفوظة © 2026 لمتجر <span class="text-arcRed font-bold">ARC STORE</span></p>
    </footer>

    <!-- السكريبت والمنطق البرمجي -->
    <script>
        const DEFAULT_CATEGORIES = ['الكل', 'إنستغرام', 'تيك توك', 'اشتراكات رقمية'];
        const DEFAULT_PRODUCTS = [
            { id: 1, name: 'متابعين إنستغرام حقيقيين', category: 'إنستغرام', minQty: 250, maxQty: 50000, priceAED: 15, img: 'https://cdn-icons-png.flaticon.com/512/174/174855.png' },
            { id: 2, name: 'مشاهدات تيك توك سريعة', category: 'تيك توك', minQty: 250, maxQty: 100000, priceAED: 10, img: 'https://cdn-icons-png.flaticon.com/512/3046/3046121.png' },
            { id: 3, name: 'اشتراك نتفليكس شهر كامل', category: 'اشتراكات رقمية', minQty: 1, maxQty: 10, priceAED: 35, img: 'https://cdn-icons-png.flaticon.com/512/732/732228.png' }
        ];
        const DEFAULT_REVIEWS = [
            { name: "عبدالله العتيبي", comment: "أفضل متجر تعاملت معه، سرعة في تنفيذ المتابعين فورية!", stars: 5, date: "قبل ساعة" },
            { name: "سارة الشمري", comment: "خدمة الاشتراكات ممتازة وشغال معي بدون أي انقطاع.", stars: 5, date: "قبل 3 ساعات" },
            { name: "محمد الشحي", comment: "دعم فني متجاوب وسريع بالواتساب. شكراً لكم!", stars: 5, date: "قبل يوم" }
        ];

        let categories = JSON.parse(localStorage.getItem('arc_categories')) || DEFAULT_CATEGORIES;
        let products = JSON.parse(localStorage.getItem('arc_products')) || DEFAULT_PRODUCTS;
        let orders = JSON.parse(localStorage.getItem('arc_orders')) || [];
        
        let cart = [];
        let currentCurrency = 'AED'; // الدرهم هو الأساس
        let discountPercent = 0;
        let activeCategory = 'الكل';

        const currencyRates = { AED: 1, SAR: 1.02, USD: 0.27 };
        const currencySymbols = { AED: 'د.إ', SAR: 'ر.س', USD: '$' };

        window.onload = function() {
            renderCategories();
            renderProducts();
            animateCounters();
            renderReviews();
            setTimeout(openReviewsModal, 1000);
        };

        function animateCounters() {
            let targetOrders = 1480 + orders.length;
            let targetClients = 1250;
            let c1 = 0, c2 = 0;
            let timer = setInterval(() => {
                if(c1 < targetOrders) c1 += 25; else c1 = targetOrders;
                if(c2 < targetClients) c2 += 20; else c2 = targetClients;
                document.getElementById('statOrders').innerText = c1 + "+";
                document.getElementById('statClients').innerText = c2 + "+";
                if(c1 === targetOrders && c2 === targetClients) clearInterval(timer);
            }, 30);
        }

        function renderReviews() {
            const list = document.getElementById('reviewsList');
            list.innerHTML = DEFAULT_REVIEWS.map(r => `
                <div class="bg-black/60 border border-white/10 p-3 rounded-xl">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-xs text-white">${r.name}</span>
                        <span class="text-amber-400 text-xs">${'★'.repeat(r.stars)}</span>
                    </div>
                    <p class="text-xs text-gray-300 mb-1">${r.comment}</p>
                    <span class="text-[10px] text-gray-500">${r.date}</span>
                </div>
            `).join('');
        }

        function openReviewsModal() { document.getElementById('reviewsModal').classList.remove('hidden'); }
        function closeReviewsModal() { document.getElementById('reviewsModal').classList.add('hidden'); }

        function changeCurrency(curr) {
            currentCurrency = curr;
            renderProducts();
            updateCartUI();
        }

        function renderCategories() {
            const container = document.getElementById('categoryFilters');
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeCategory === cat ? 'neon-btn text-white shadow-lg' : 'bg-arcCard text-gray-400 hover:text-white border border-white/10'}">
                    ${cat}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('productsGrid');
            const filtered = activeCategory === 'الكل' ? products : products.filter(p => p.category === activeCategory);

            container.innerHTML = filtered.map(p => {
                const minQty = p.minQty || 1;
                const maxQty = p.maxQty || 100000;
                const convertedPrice = (p.priceAED * currencyRates[currentCurrency]).toFixed(2);
                
                return `
                    <div class="bg-arcCard neon-border-subtle rounded-2xl p-5 transition duration-300 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <img src="${p.img || 'https://cdn-icons-png.flaticon.com/512/174/174855.png'}" class="w-12 h-12 rounded-xl p-2 bg-black border border-white/10 object-contain">
                                <span class="text-[10px] bg-arcRed/20 text-arcRed border border-arcRed/40 px-2.5 py-1 rounded-full font-bold">${p.category}</span>
                            </div>
                            <h3 class="font-bold text-base text-white mb-2">${p.name}</h3>
                            <div class="text-[11px] text-gray-400 mb-4 space-y-1">
                                <div>أقل كمية للطلب: <span class="text-white font-bold">${minQty}</span></div>
                                <div>أعلى كمية للطلب: <span class="text-white font-bold">${maxQty}</span></div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="flex items-center justify-between bg-black p-2.5 rounded-xl border border-white/10">
                                <span class="text-xs text-gray-400">الكمية:</span>
                                <input type="number" id="qty-${p.id}" value="${minQty}" min="${minQty}" max="${maxQty}" class="bg-black text-center text-xs font-bold text-white w-24 py-1 rounded-lg border border-white/20 outline-none focus:border-arcRed">
                            </div>

                            <div class="flex justify-between items-center">
                                <div>
                                    <span class="text-xs text-gray-400 block">السعر الأساسي:</span>
                                    <span class="text-lg font-black text-arcRed neon-text">${convertedPrice} ${currencySymbols[currentCurrency]}</span>
                                </div>
                                <button onclick="addToCart(${p.id})" class="px-4 py-2.5 neon-btn text-white rounded-xl text-xs font-bold transition flex items-center gap-2">
                                    <i class="fa-solid fa-plus"></i> للسلة
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addToCart(productId) {
            const prod = products.find(p => p.id === productId);
            const qtyInput = document.getElementById(`qty-${productId}`);
            const qty = parseInt(qtyInput.value);
            const minQty = prod.minQty || 1;
            const maxQty = prod.maxQty || 100000;

            if(qty < minQty) return alert(`أقل كمية مسموحة لهذا المنتج هي ${minQty}`);
            if(qty > maxQty) return alert(`أعلى كمية مسموحة لهذا المنتج هي ${maxQty}`);

            const existingIndex = cart.findIndex(item => item.id === productId);
            if(existingIndex > -1) {
                cart[existingIndex].qty = qty;
            } else {
                cart.push({ ...prod, qty });
            }

            updateCartUI();
            toggleCartDrawer(true);
        }

        function updateCartUI() {
            document.getElementById('cartBadge').innerText = cart.length;
            const cartItemsContainer = document.getElementById('cartItems');

            if(cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-center text-xs text-gray-500 py-8">سلة التسوق فارغة حالياً</p>`;
            } else {
                cartItemsContainer.innerHTML = cart.map((item, idx) => {
                    const price = ((item.priceAED * (item.qty / (item.minQty >= 250 ? 1000 : 1))) * currencyRates[currentCurrency]).toFixed(2);
                    return `
                        <div class="bg-black p-3 rounded-xl border border-white/10 flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-xs text-white">${item.name}</h4>
                                <span class="text-[10px] text-gray-400">الكمية: ${item.qty} | ${price} ${currencySymbols[currentCurrency]}</span>
                            </div>
                            <button onclick="removeFromCart(${idx})" class="text-red-500 hover:text-red-400 text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                }).join('');
            }

            let subtotal = cart.reduce((sum, item) => {
                const base = (item.minQty >= 250) ? (item.priceAED * (item.qty / 1000)) : (item.priceAED * item.qty);
                return sum + base;
            }, 0);

            let discount = subtotal * discountPercent;
            let total = subtotal - discount;

            document.getElementById('subtotalPrice').innerText = (subtotal * currencyRates[currentCurrency]).toFixed(2) + " " + currencySymbols[currentCurrency];
            document.getElementById('totalPrice').innerText = (total * currencyRates[currentCurrency]).toFixed(2) + " " + currencySymbols[currentCurrency];

            if(discountPercent > 0) {
                document.getElementById('discountRow').classList.remove('hidden');
                document.getElementById('discountPrice').innerText = "-" + (discount * currencyRates[currentCurrency]).toFixed(2) + " " + currencySymbols[currentCurrency];
            } else {
                document.getElementById('discountRow').classList.add('hidden');
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCartDrawer(open) {
            const drawer = document.getElementById('cartDrawer');
            if(open || drawer.classList.contains('opacity-0')) {
                drawer.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                drawer.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function applyCoupon() {
            const code = document.getElementById('couponCode').value.trim().toUpperCase();
            const msg = document.getElementById('couponMessage');
            msg.classList.remove('hidden');

            if(code === 'ARC2026') {
                discountPercent = 0.1;
                msg.innerText = "تم تطبيق خصم 10% بنجاح!";
                msg.className = "text-xs font-bold text-emerald-400";
            } else {
                discountPercent = 0;
                msg.innerText = "كود الخصم غير صحيح";
                msg.className = "text-xs font-bold text-red-400";
            }
            updateCartUI();
        }

        function checkoutToWhatsApp() {
            if(cart.length === 0) return alert('السلة فارغة!');

            const name = document.getElementById('custName').value.trim();
            const email = document.getElementById('custEmail').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const account = document.getElementById('custAccount').value.trim();

            if(!name || !email || !phone || !account) {
                return alert('يرجى تعبئة كافة بيانات الطلب المطلوبة!');
            }

            let itemsText = cart.map(i => `- ${i.name} (الكمية: ${i.qty})`).join('\n');
            let totalVal = document.getElementById('totalPrice').innerText;

            let msg = `طلب جديد من ARC STORE 🛒\n\n` +
                      `👤 الاسم: ${name}\n` +
                      `📧 البريد: ${email}\n` +
                      `📱 الواتساب: ${phone}\n` +
                      `🔗 الحساب المستهدف: ${account}\n\n` +
                      `المنتجات المطلوبة:\n${itemsText}\n\n` +
                      `💰 الإجمالي النهائي: ${totalVal}`;

            orders.unshift({ id: Date.now(), name, phone, email, account, items: cart, date: new Date().toLocaleString() });
            localStorage.setItem('arc_orders', JSON.stringify(orders));

            const whatsappNumber = "966500000000";
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
